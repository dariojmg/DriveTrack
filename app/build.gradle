plugins { id 'com.android.application' }

def driveSigning = new Properties()
def signingPropertiesPath = System.getenv('DRIVETRACK_SIGNING_PROPERTIES')
if (signingPropertiesPath && file(signingPropertiesPath).isFile()) {
    file(signingPropertiesPath).withInputStream { stream -> driveSigning.load(stream) }
}

android {
    namespace 'com.drivetrack.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.drivetrack.app'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '1.8.0-beta'
    }
    signingConfigs {
        permanentRelease {
            storeFile file(System.getenv('DRIVETRACK_KEYSTORE_PATH') ?: 'signing-not-configured.p12')
            storePassword driveSigning.getProperty('storePassword', '')
            keyAlias driveSigning.getProperty('keyAlias', 'drivetrack')
            keyPassword driveSigning.getProperty('keyPassword', '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.permanentRelease
        }
    }
}
