name: Build DriveTrack APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DriveTrack.apk
          test -s DriveTrack.apk
      - name: Save APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveTrack-APK
          path: DriveTrack.apk
          retention-days: 90
      - name: Publish direct APK download
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: DriveTrack beta ${{ github.run_number }}
          prerelease: true
          make_latest: true
          files: DriveTrack.apk
          body: "Android beta build. This is debug-signed, and future install-over updates may require persistent signing. Do not interact with the app while driving."
